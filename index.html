
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rouita Player</title>

    <!-- Bibliothèques du lecteur d'origine -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Nom du lecteur en haut à gauche */
        #brand {
            position: absolute;
            top: 15px;
            left: 18px;
            z-index: 20;
            color: #20df82;
            background: rgba(0, 0, 0, .72);
            border: 1px solid rgba(32, 223, 130, .45);
            border-radius: 6px;
            padding: 9px 13px;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(32, 223, 130, .25);
        }

        /* Nom de la chaîne en cours */
        #channel-info {
            position: absolute;
            top: 66px;
            left: 18px;
            z-index: 20;
            max-width: calc(100% - 36px);
            color: #fff;
            background: rgba(0, 0, 0, .72);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            overflow-wrap: anywhere;
            pointer-events: none;
        }

        #channel-name {
            color: #20df82;
            font-weight: bold;
        }

        #status {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 15;
            max-width: calc(100% - 24px);
            padding: 7px 10px;
            color: #ddd;
            background: rgba(0, 0, 0, .7);
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }

        #error-message {
            display: none;
            position: absolute;
            z-index: 30;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(88%, 600px);
            padding: 20px;
            color: white;
            background: rgba(35, 0, 0, .96);
            border: 1px solid #f55;
            border-radius: 8px;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        #error-message strong {
            display: block;
            color: #ff7777;
            margin-bottom: 8px;
        }

        #retry {
            margin-top: 12px;
            padding: 9px 15px;
            color: white;
            background: #087c49;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #brand {
                top: 9px;
                left: 9px;
                font-size: 14px;
                padding: 7px 9px;
            }

            #channel-info {
                top: 52px;
                left: 9px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="brand">📺 ROUITA PLAYER</div>

    <div id="channel-info">
        Chaîne : <span id="channel-name">En attente…</span>
    </div>

    <div id="status">Initialisation…</div>

    <div id="error-message" role="alert" aria-live="polite">
        <strong>Erreur de lecture</strong>
        <span id="error-detail"></span>
        <br>
        <button id="retry" type="button">Réessayer</button>
    </div>

    <video id="video" controls autoplay playsinline preload="auto"></video>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        "use strict";

        const params = new URLSearchParams(location.search);
        const videoUrl = (params.get("url") || "").trim();

        const video = document.getElementById("video");
        const channelName = document.getElementById("channel-name");
        const status = document.getElementById("status");
        const errorBox = document.getElementById("error-message");
        const errorDetail = document.getElementById("error-detail");

        let hlsPlayer = null;
        let tsPlayer = null;
        let attemptId = 0;
        let recoveryAttempted = false;

        function setStatus(message) {
            status.textContent = message;
        }

        function showError(message) {
            errorDetail.textContent = message;
            errorBox.style.display = "block";
            setStatus("Échec de lecture");
        }

        function clearError() {
            errorBox.style.display = "none";
            errorDetail.textContent = "";
        }

        // Détermine le nom affiché sans inventer le nom officiel.
        function getChannelName(url) {
            const explicitName =
                params.get("name") ||
                params.get("channel") ||
                params.get("title");

            if (explicitName && explicitName.trim()) {
                return explicitName.trim();
            }

            try {
                const parsed = new URL(url);
                let filename = decodeURIComponent(
                    parsed.pathname.split("/").pop() || ""
                );

                filename = filename
                    .replace(/\.(m3u8|m3u|ts|m2ts|flv|mp4|m4v|webm)$/i, "")
                    .replace(/[_-]+/g, " ")
                    .trim();

                // Ne pas afficher un identifiant technique comme
                // s'il s'agissait forcément du nom de la chaîne.
                if (!filename || /^(index|live|stream|playlist|video)$/i.test(filename)) {
                    return "Nom non disponible";
                }

                return filename;
            } catch (_) {
                return "Nom non disponible";
            }
        }

        function destroyPlayers() {
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            if (tsPlayer) {
                tsPlayer.destroy();
                tsPlayer = null;
            }

            video.pause();
            video.removeAttribute("src");
            video.load();
        }

        function requestPlay(id) {
            if (id !== attemptId) return;

            video.play().catch(function (error) {
                if (id !== attemptId) return;

                if (error.name === "NotAllowedError") {
                    setStatus("Cliquez sur ▶ pour démarrer la lecture");
                } else {
                    console.warn("Lecture :", error);
                }
            });
        }

        function startPlayback() {
            const id = ++attemptId;
            recoveryAttempted = false;

            clearError();
            destroyPlayers();

            if (!videoUrl) {
                channelName.textContent = "Aucune chaîne";
                showError(
                    "URL absente. Ajoutez ?url=ADRESSE_DU_FLUX à l'adresse du lecteur."
                );
                return;
            }

            channelName.textContent = getChannelName(videoUrl);

            let parsed;
            try {
                parsed = new URL(videoUrl);
            } catch (_) {
                showError("L'adresse du flux n'est pas une URL valide.");
                return;
            }

            if (!["http:", "https:"].includes(parsed.protocol)) {
                showError("Seules les URL HTTP et HTTPS sont acceptées.");
                return;
            }

            const path = parsed.pathname.toLowerCase();

            const isHls = /\.m3u8$/.test(path);
            const isTs = /\.(ts|m2ts)$/.test(path);
            const isFlv = /\.flv$/.test(path);
            const isMp4 = /\.(mp4|m4v|m4a)$/.test(path);
            const isWebm = /\.webm$/.test(path);

            if (isHls) {
                playHls(videoUrl, id);
            } else if (isTs || isFlv) {
                playMpegTs(videoUrl, isFlv ? "flv" : "mpegts", id);
            } else if (isMp4 || isWebm) {
                playNative(videoUrl, id);
            } else {
                // Pour les URL sans extension reconnaissable :
                // tentative native, sans supposer qu'il s'agit de HLS.
                playNative(videoUrl, id);
            }
        }

        function playHls(url, id) {
            setStatus("Chargement HLS…");

            if (window.Hls && Hls.isSupported()) {
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,

                    // Tampon modéré pour accélérer le démarrage
                    // et limiter l'utilisation de la mémoire.
                    maxBufferLength: 8,
                    maxMaxBufferLength: 15,
                    backBufferLength: 15,

                    // Synchronisation adaptée aux flux en direct.
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 6
                });

                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                    if (id !== attemptId) return;
                    setStatus("HLS prêt — démarrage…");
                    requestPlay(id);
                });

                hlsPlayer.on(Hls.Events.LEVEL_LOADED, function (event, data) {
                    if (id !== attemptId) return;

                    const details = data && data.details;
                    const fragments = details && details.fragments;

                    // Certains playlists fournissent un titre de segment.
                    // Il ne s'agit pas nécessairement du nom de la chaîne.
                    if (fragments && fragments.length && fragments[0].title) {
                        console.debug("Métadonnée HLS :", fragments[0].title);
                    }
                });

                hlsPlayer.on(Hls.Events.ERROR, function (event, data) {
                    if (id !== attemptId || !data.fatal) return;

                    console.error("Erreur HLS :", data);

                    if (
                        data.type === Hls.ErrorTypes.MEDIA_ERROR &&
                        !recoveryAttempted
                    ) {
                        recoveryAttempted = true;
                        setStatus("Récupération du flux…");
                        hlsPlayer.recoverMediaError();
                        return;
                    }

                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        showError(
                            "Erreur réseau HLS : " + data.details +
                            ". Vérifiez l'URL, la connexion et les autorisations du serveur."
                        );
                    } else {
                        showError(
                            "Erreur HLS : " + data.details +
                            ". Le flux ou son codec peut être incompatible."
                        );
                    }
                });

                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);

            } else if (
                video.canPlayType("application/vnd.apple.mpegurl")
            ) {
                playNative(url, id);
            } else {
                showError("HLS n'est pas pris en charge par ce navigateur.");
            }
        }

        function playMpegTs(url, type, id) {
            setStatus("Chargement " + type.toUpperCase() + "…");

            if (!window.mpegts || !mpegts.isSupported()) {
                showError(
                    type.toUpperCase() +
                    " nécessite un navigateur compatible avec Media Source Extensions."
                );
                return;
            }

            tsPlayer = mpegts.createPlayer({
                type: type,
                isLive: true,
                url: url
            }, {
                enableWorker: true,

                // Évite le gros tampon initial des flux en direct.
                enableStashBuffer: false,

                // Options de poursuite du direct, si prises en charge.
                liveBufferLatencyChasing: true
            });

            tsPlayer.on(mpegts.Events.ERROR, function (
                errorType, errorDetailValue, errorInfo
            ) {
                if (id !== attemptId) return;

                console.error(
                    "Erreur MPEG-TS/FLV :",
                    errorType, errorDetailValue, errorInfo
                );

                showError(
                    "Erreur " + type.toUpperCase() + " : " +
                    String(errorType) + " / " +
                    String(errorDetailValue) +
                    ". Vérifiez le réseau, le format et le codec."
                );
            });

            tsPlayer.attachMediaElement(video);
            tsPlayer.load();

            setStatus(type.toUpperCase() + " chargé — démarrage…");
            requestPlay(id);
        }

        function playNative(url, id) {
            setStatus("Ouverture du flux vidéo…");
            video.src = url;
            video.load();
            requestPlay(id);
        }

        video.addEventListener("playing", function () {
            clearError();
            setStatus("Lecture en cours");
        });

        video.addEventListener("waiting", function () {
            setStatus("Chargement du flux…");
        });

        video.addEventListener("stalled", function () {
            setStatus("Attente du réseau…");
        });

        video.addEventListener("error", function () {
            const err = video.error;
            if (!err) return;

            const messages = {
                1: "Lecture interrompue.",
                2: "Erreur réseau pendant le chargement.",
                3: "Erreur de décodage : données ou codec incompatibles.",
                4: "Format non pris en charge ou source inaccessible."
            };

            showError(
                (messages[err.code] || "Erreur vidéo inconnue.") +
                " Code : " + err.code
            );
        });

        document.getElementById("retry").addEventListener(
            "click", startPlayback
        );

        window.addEventListener("pagehide", destroyPlayers);

        startPlayback();
    });
    </script>

</body>
</html>
