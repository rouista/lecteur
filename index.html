<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rouista Universel Player</title>
    
    <!-- Styles et Script du lecteur moderne Video.js -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    
    <!-- Bibliothèque pour le format .ts et .flv -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Style moderne personnalisé pour Video.js */
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        .vjs-theme-modern .vjs-big-play-button {
            border-radius: 50%;
            width: 2em;
            height: 2em;
            line-height: 2em;
            margin-top: -1em;
            margin-left: -1em;
        }

        #error-message {
            color: #fff;
            background: rgba(255, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 5px;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="error-message">Aucune URL vidéo valide n'a été fournie ou format non supporté.</div>
        
        <!-- La balise vidéo standard configurée pour Video.js -->
        <video id="rouista-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline></video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const errorDiv = document.getElementById('error-message');
            const videoElement = document.getElementById('rouista-player');

            if (!videoUrl) {
                errorDiv.style.display = 'block';
                return;
            }

            const cleanUrl = videoUrl.toLowerCase();

            // 1. Détection des formats TS et FLV (nécessitent mpegts.js)
            if (cleanUrl.includes('.ts') || cleanUrl.includes('.flv')) {
                if (mpegts.isSupported()) {
                    let type = cleanUrl.includes('.ts') ? 'mpegts' : 'flv';
                    
                    const mpegtsPlayer = mpegts.createPlayer({
                        type: type,
                        isLive: true,
                        url: videoUrl
                    });
                    
                    mpegtsPlayer.attachMediaElement(videoElement);
                    mpegtsPlayer.load();
                    
                    // Initialisation cosmétique de Video.js par-dessus pour garder l'interface moderne
                    videojs(videoElement, {
                        controls: true,
                        autoplay: true,
                        fluid: true
                    });
                } else {
                    videoElement.src = videoUrl;
                    videojs(videoElement);
                }
            } 
            // 2. Détection du format HLS / M3U8 (géré nativement par Video.js)
            else if (cleanUrl.includes('.m3u8')) {
                videojs(videoElement, {
                    controls: true,
                    autoplay: true,
                    sources: [{
                        src: videoUrl,
                        type: 'application/x-mpegURL'
                    }]
                });
            } 
            // 3. Autres formats standards (MP4, WebM, etc.)
            else {
                videojs(videoElement, {
                    controls: true,
                    autoplay: true,
                    sources: [{
                        src: videoUrl,
                        type: 'video/mp4'
                    }]
                });
            }
        });
    </script>
</body>
</html>
