<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rouita Player</title>
    <!-- Chargement de la bibliothèque Hls.js pour gérer les flux .m3u8 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .player-container { max-width: 800px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; display: block; }
        .error { color: #ff4d4d; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📺 ROUITA PLAYER</h1>
    
    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
        <div id="error-message" class="error" style="display: none;">Erreur de lecture</div>
    </div>

    <script>
        // Fonction pour récupérer le paramètre ?url= dans l'adresse de la page
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const streamUrl = getQueryParam('url');
        const video = document.getElementById('video');
        const errorDiv = document.getElementById('error-message');

        if (streamUrl) {
            // Vérification si le format est du HLS (.m3u8)
            if (streamUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            errorDiv.style.display = 'block';
                            errorDiv.innerText = "Erreur fatale de flux HLS (Vérifiez si le lien a expiré ou bloque le CORS).";
                        }
                    });
                } 
                // Pour Safari qui gère le HLS nativement
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = "Votre navigateur ne supporte pas la lecture HLS.";
                }
            } else {
                // Si c'vest une vidéo classique (mp4, webm...)
                video.src = streamUrl;
            }
        } else {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Aucune URL de flux détectée dans l'adresse. Ajoutez ?url=LIEN";
        }
    </script>
</body>
</html>
