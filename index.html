<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rouita Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #brand {
            position: absolute;
            top: 15px;
            left: 18px;
            z-index: 20;
            color: #20df82;
            background: rgba(0, 0, 0, .72);
            border: 1px solid rgba(32, 223, 130, .45);
            border-radius: 6px;
            padding: 9px 13px;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(32, 223, 130, .25);
        }

        #channel-info {
            position: absolute;
            top: 66px;
            left: 18px;
            z-index: 20;
            max-width: calc(100% - 36px);
            color: #fff;
            background: rgba(0, 0, 0, .72);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            overflow-wrap: anywhere;
            pointer-events: none;
        }

        #channel-name {
            color: #20df82;
            font-weight: bold;
        }

        #status {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 15;
            max-width: calc(100% - 24px);
            padding: 7px 10px;
            color: #ddd;
            background: rgba(0, 0, 0, .7);
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }

        #error-message {
            display: none;
            position: absolute;
            z-index: 30;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(88%, 600px);
            padding: 20px;
            color: white;
            background: rgba(35, 0, 0, .96);
            border: 1px solid #f55;
            border-radius: 8px;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        #error-message strong {
            display: block;
            color: #ff7777;
            margin-bottom: 8px;
        }

        #retry {
            margin-top: 12px;
            padding: 9px 15px;
            color: white;
            background: #087c49;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #brand {
                top: 9px;
                left: 9px;
                font-size: 14px;
                padding: 7px 9px;
            }

            #channel-info {
                top: 52px;
                left: 9px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="brand">📺 ROUITA PLAYER</div>

    <div id="channel-info">
        Chaîne : <span id="channel-name">En attente…</span>
    </div>

    <div id="status">Initialisation…</div>

    <div id="error-message" role="alert" aria-live="polite">
        <strong>Erreur de lecture</strong>
        <span id="error-detail"></span>
        <br>
        <button id="retry" type="button">Réessayer</button>
    </div>

    <video id="video" controls autoplay playsinline preload="auto"></video>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        "use strict";

        const params = new URLSearchParams(location.search);
        const rawUrl = (params.get("url") || "").trim();
        // Décodage éventuel d'une URL passée elle-même encodée
        let videoUrl = rawUrl;
        try { if (/^https?%3A/i.test(videoUrl)) videoUrl = decodeURIComponent(videoUrl); } catch (_) {}

        const video = document.getElementById("video");
        const channelName = document.getElementById("channel-name");
        const status = document.getElementById("status");
        const errorBox = document.getElementById("error-message");
        const errorDetail = document.getElementById("error-detail");
        const retryBtn = document.getElementById("retry");

        let hlsPlayer = null;
        let tsPlayer = null;
        let attemptId = 0;
        let recoveryAttempted = false;
        let loadTimeout = null;
        let playing = false;
        let retryLocked = false;

        function setStatus(message) {
            status.textContent = message;
        }

        function showError(message) {
            errorDetail.textContent = message;
            errorBox.style.display = "block";
            setStatus("Échec de lecture");
            clearLoadTimeout();
        }

        function clearError() {
            errorBox.style.display = "none";
            errorDetail.textContent = "";
        }

        function clearLoadTimeout() {
            if (loadTimeout) {
                clearTimeout(loadTimeout);
                loadTimeout = null;
            }
        }

        function armLoadTimeout(id, ms) {
            clearLoadTimeout();
            loadTimeout = setTimeout(function () {
                if (id !== attemptId || playing) return;
                showError("Délai de chargement dépassé. Le flux ne répond pas ou est inaccessible.");
            }, ms || 25000);
        }

        // Détection robuste du type de flux à partir de l'URL (chemin + query)
        function detectType(url) {
            let p = "";
            try {
                const u = new URL(url);
                p = (u.pathname + u.search).toLowerCase();
            } catch (_) {
                p = url.toLowerCase();
            }
            if (/\.m3u8(\b|$)/.test(p) || /type=m3u8/.test(p) || /format=m3u8/.test(p)) return "hls";
            if (/\.(ts|m2ts|mts)(\b|$)/.test(p)) return "mpegts";
            if (/\.flv(\b|$)/.test(p)) return "flv";
            if (/\.(mp4|m4v|m4a|mov)(\b|$)/.test(p)) return "mp4";
            if (/\.webm(\b|$)/.test(p)) return "webm";
            if (/\.mp3(\b|$)/.test(p)) return "mp3";
            return "unknown";
        }

        function getChannelName(url) {
            const explicitName =
                params.get("name") ||
                params.get("channel") ||
                params.get("title");

            if (explicitName && explicitName.trim()) return explicitName.trim();

            try {
                const parsed = new URL(url);
                let filename = decodeURIComponent(
                    (parsed.pathname.split("/").pop() || "")
                );
                filename = filename
                    .replace(/\.(m3u8|m3u|ts|m2ts|flv|mp4|m4v|m4a|webm|mp3|mov)$/i, "")
                    .replace(/[_\-.]+/g, " ")
                    .trim();

                if (!filename || /^(index|live|stream|playlist|video|manifest|master)$/i.test(filename)) {
                    return parsed.hostname || "Nom non disponible";
                }
                return filename;
            } catch (_) {
                return "Nom non disponible";
            }
        }

        function destroyPlayers() {
            clearLoadTimeout();
            if (hlsPlayer) {
                try { hlsPlayer.destroy(); } catch (_) {}
                hlsPlayer = null;
            }
            if (tsPlayer) {
                try { tsPlayer.destroy(); } catch (_) {}
                tsPlayer = null;
            }
            try {
                video.pause();
                video.removeAttribute("src");
                video.load();
            } catch (_) {}
            playing = false;
        }

        function requestPlay(id) {
            if (id !== attemptId) return;
            const p = video.play();
            if (p && typeof p.catch === "function") {
                p.catch(function (error) {
                    if (id !== attemptId) return;
                    if (error && error.name === "NotAllowedError") {
                        setStatus("Cliquez sur ▶ pour démarrer la lecture");
                    } else {
                        console.warn("Lecture :", error);
                    }
                });
            }
        }

        function startPlayback() {
            const id = ++attemptId;
            recoveryAttempted = false;
            playing = false;

            clearError();
            destroyPlayers();

            if (!videoUrl) {
                channelName.textContent = "Aucune chaîne";
                showError("URL absente. Ajoutez ?url=ADRESSE_DU_FLUX à l'adresse du lecteur.");
                return;
            }

            channelName.textContent = getChannelName(videoUrl);

            let parsed;
            try {
                parsed = new URL(videoUrl);
            } catch (_) {
                showError("L'adresse du flux n'est pas une URL valide.");
                return;
            }

            if (!["http:", "https:"].includes(parsed.protocol)) {
                showError("Seules les URL HTTP et HTTPS sont acceptées.");
                return;
            }

            armLoadTimeout(id, 25000);

            const type = detectType(videoUrl);

            if (type === "hls") {
                playHls(videoUrl, id);
            } else if (type === "mpegts" || type === "flv") {
                playMpegTs(videoUrl, type, id);
            } else {
                // Inconnu (ou mp4/webm) : on tente le natif d'abord,
                // puis fallback HLS/mpegts en cas d'échec.
                playNativeWithFallback(videoUrl, id, type);
            }
        }

        // ------------------------------------------------------------------
        // HLS
        // ------------------------------------------------------------------
        function playHls(url, id) {
            setStatus("Chargement HLS…");

            if (window.Hls && Hls.isSupported()) {
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxBufferLength: 8,
                    maxMaxBufferLength: 15,
                    backBufferLength: 15,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 6,
                    manifestLoadingTimeOut: 15000,
                    manifestLoadingMaxRetry: 3,
                    levelLoadingTimeOut: 15000,
                    fragLoadingTimeOut: 25000,
                    fragLoadingMaxRetry: 4
                });

                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                    if (id !== attemptId) return;
                    setStatus("HLS prêt — démarrage…");
                    requestPlay(id);
                });

                hlsPlayer.on(Hls.Events.ERROR, function (event, data) {
                    if (id !== attemptId || !data.fatal) return;
                    console.error("Erreur HLS :", data);

                    if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recoveryAttempted) {
                        recoveryAttempted = true;
                        setStatus("Récupération du flux…");
                        try { hlsPlayer.recoverMediaError(); } catch (_) {}
                        return;
                    }

                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        showError("Erreur réseau HLS : " + data.details +
                            ". Vérifiez l'URL, la connexion et les autorisations du serveur (CORS).");
                    } else {
                        showError("Erreur HLS : " + data.details +
                            ". Le flux ou son codec peut être incompatible.");
                    }
                });

                try {
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(video);
                } catch (e) {
                    showError("Impossible d'initialiser HLS : " + e.message);
                }

            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                playNative(url, id);
            } else {
                showError("HLS n'est pas pris en charge par ce navigateur.");
            }
        }

        // ------------------------------------------------------------------
        // MPEG-TS / FLV
        // ------------------------------------------------------------------
        function playMpegTs(url, type, id) {
            setStatus("Chargement " + type.toUpperCase() + "…");

            if (!window.mpegts || !mpegts.isSupported()) {
                showError(
                    type.toUpperCase() +
                    " nécessite un navigateur compatible avec Media Source Extensions."
                );
                return;
            }

            try {
                tsPlayer = mpegts.createPlayer({
                    type: type === "flv" ? "flv" : "mpegts",
                    isLive: true,
                    url: url
                }, {
                    enableWorker: true,
                    enableStashBuffer: false,
                    liveBufferLatencyChasing: true,
                    lazyLoad: false,
                    lazyLoadMaxDuration: 0,
                    autoCleanupSourceBuffer: true
                });
            } catch (e) {
                showError("Impossible d'initialiser le lecteur " + type.toUpperCase() + " : " + e.message);
                return;
            }

            tsPlayer.on(mpegts.Events.ERROR, function (errorType, errorDetailValue, errorInfo) {
                if (id !== attemptId) return;
                console.error("Erreur MPEG-TS/FLV :", errorType, errorDetailValue, errorInfo);
                showError(
                    "Erreur " + type.toUpperCase() + " : " +
                    String(errorType) + " / " + String(errorDetailValue) +
                    ". Vérifiez le réseau, le format et le codec."
                );
            });

            tsPlayer.on(mpegts.Events.MEDIA_INFO, function () {
                if (id !== attemptId) return;
                setStatus(type.toUpperCase() + " chargé — démarrage…");
                requestPlay(id);
            });

            try {
                tsPlayer.attachMediaElement(video);
                tsPlayer.load();
            } catch (e) {
                showError("Erreur d'attachement " + type.toUpperCase() + " : " + e.message);
                return;
            }

            setStatus(type.toUpperCase() + " chargé — démarrage…");
            requestPlay(id);
        }

        // ------------------------------------------------------------------
        // Natif + fallback
        // ------------------------------------------------------------------
        function playNative(url, id) {
            setStatus("Ouverture du flux vidéo…");
            video.src = url;
            video.load();
            requestPlay(id);
        }

        function playNativeWithFallback(url, id, type) {
            // Pour les types connus natifs (mp4/webm/mp3), on tente le natif,
            // puis fallback HLS → mpegts si erreur immédiate.
            if (type === "mp4" || type === "webm" || type === "mp3") {
                playNative(url, id);
                return;
            }

            // Type inconnu : HLS d'abord (le plus courant pour les URLs sans extension)
            if (window.Hls && Hls.isSupported()) {
                playHls(url, id);
            } else {
                playNative(url, id);
            }
        }

        // ------------------------------------------------------------------
        // Écouteurs vidéo
        // ------------------------------------------------------------------
        video.addEventListener("playing", function () {
            playing = true;
            clearLoadTimeout();
            clearError();
            setStatus("Lecture en cours");
        });

        video.addEventListener("waiting", function () {
            setStatus("Chargement du flux…");
        });

        video.addEventListener("stalled", function () {
            setStatus("Attente du réseau…");
        });

        video.addEventListener("error", function () {
            const err = video.error;
            if (!err) return;

            // Si HLS/mpegts gère déjà l'erreur, ne pas double-afficher
            if (hlsPlayer || tsPlayer) return;

            const messages = {
                1: "Lecture interrompue.",
                2: "Erreur réseau pendant le chargement.",
                3: "Erreur de décodage : données ou codec incompatibles.",
                4: "Format non pris en charge ou source inaccessible."
            };

            showError((messages[err.code] || "Erreur vidéo inconnue.") + " Code : " + err.code);
        });

        // ------------------------------------------------------------------
        // Bouton réessayer (verrouillé brièvement pour éviter le spam)
        // ------------------------------------------------------------------
        retryBtn.addEventListener("click", function () {
            if (retryLocked) return;
            retryLocked = true;
            retryBtn.disabled = true;
            startPlayback();
            setTimeout(function () {
                retryLocked = false;
                retryBtn.disabled = false;
            }, 1500);
        });

        window.addEventListener("pagehide", destroyPlayers);
        window.addEventListener("beforeunload", destroyPlayers);

        startPlayback();
    });
    </script>

</body>
</html>
