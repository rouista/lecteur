<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Multi-Flux</title>
    
    <!-- Intégration des deux bibliothèques demandées -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        #error-message {
            color: #fff;
            background: rgba(255, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 5px;
            display: none;
            position: absolute;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="error-message">Aucune URL vidéo valide n'a été fournie ou format non supporté.</div>
    <video id="video" controls autoplay playsinline></video>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const video = document.getElementById('video');
            const errorDiv = document.getElementById('error-message');

            if (!videoUrl) {
                errorDiv.style.display = 'block';
                return;
            }

            // Nettoyage de l'URL pour enlever les paramètres lors de la détection de l'extension
            const cleanUrl = videoUrl.split('?')[0].toLowerCase();

            // 1. CAS DES FLUX HLS (.m3u8)
            if (cleanUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoUrl;
                }
            } 
            // 2. CAS DES FLUX MPEG-TS (.ts) OU FLV (.flv)
            else if (cleanUrl.includes('.ts') || cleanUrl.includes('.flv') || mpegts.getFeatureList().msePlayback) {
                if (mpegts.isSupported()) {
                    let type = 'mse'; // par défaut, détection automatique intelligente
                    if (cleanUrl.includes('.ts')) type = 'mpegts';
                    if (cleanUrl.includes('.flv')) type = 'flv';

                    const mpegtsPlayer = mpegts.createPlayer({
                        type: type,
                        isLive: true,
                        url: videoUrl
                    });
                    mpegtsPlayer.attachMediaElement(video);
                    mpegtsPlayer.load();
                } else {
                    // Repli vidéo standard si mpegts n'est pas supporté par le navigateur
                    video.src = videoUrl;
                }
            } 
            // 3. AUTRES FICHIERS STANDARDS (MP4, WebM)
            else {
                video.src = videoUrl;
            }
        });
    </script>
</body>
</html>
