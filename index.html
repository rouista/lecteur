<script>
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    let streamUrl = getQueryParam('url');
    const video = document.getElementById('video');
    const errorDiv = document.getElementById('error-message');

    // Liste de proxies CORS publics et gratuits pour contourner le blocage
    // Note : Pour un usage intensif, il est recommandé de déployer votre propre proxy sur Vercel ou Cloudflare Workers.
    const corsProxy = "https://herokuapp.com";

    if (streamUrl) {
        // Si le flux est en .m3u8, on tente d'appliquer le contournement CORS
        if (streamUrl.includes('.m3u8')) {
            
            // ÉTAPE A : On applique le proxy à l'URL pour bypasser les restrictions du serveur
            // Attention : Certains proxies nécessitent une activation préalable ou bloquent le streaming vidéo lourd.
            // Option alternative automatique : Utiliser un proxy personnalisé sans restriction
            let proxiedUrl = streamUrl; 
            
            // Décommenter la ligne suivante si vous utilisez un proxy actif :
            // proxiedUrl = corsProxy + streamUrl;

            if (Hls.isSupported()) {
                const hls = new Hls({
                    // Configuration pour forcer le lecteur à réessayer en cas d'erreur réseau
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                
                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                // Tentative de secours automatique en cas d'échec réseau direct
                                console.log("Erreur réseau détectée, tentative avec proxy de secours...");
                                hls.loadSource(corsProxy + streamUrl);
                                hls.startLoad();
                                break;
                            default:
                                errorDiv.style.display = 'block';
                                errorDiv.innerText = "Erreur de lecture : Le flux nécessite un proxy CORS privé ou a expiré.";
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
            }
        } else {
            video.src = streamUrl;
        }
    } else {
        errorDiv.style.display = 'block';
        errorDiv.innerText = "Aucune URL de flux détectée.";
    }
</script>
