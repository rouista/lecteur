
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rouita Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
        body { display:flex; align-items:center; justify-content:center; }
        video { width:100%; height:100%; object-fit:contain; background:#000; }
        #brand { position:absolute; top:15px; left:18px; z-index:20; color:#20df82; background:rgba(0,0,0,.72); border:1px solid rgba(32,223,130,.45); border-radius:6px; padding:9px 13px; font-size:17px; font-weight:bold; letter-spacing:1px; pointer-events:none; }
        #status { position:absolute; left:12px; bottom:12px; z-index:15; padding:7px 10px; color:#ddd; background:rgba(0,0,0,.7); border-radius:4px; font-size:12px; pointer-events:none; }
        #error-message { display:none; position:absolute; z-index:30; top:50%; left:50%; transform:translate(-50%,-50%); width:min(88%,600px); padding:20px; color:white; background:rgba(35,0,0,.96); border:1px solid #f55; border-radius:8px; line-height:1.5; }
        #error-message strong { display:block; color:#ff7777; margin-bottom:8px; }
        #retry { margin-top:12px; padding:9px 15px; color:white; background:#087c49; border:0; border-radius:5px; cursor:pointer; }
        #retry:disabled { opacity:.6; cursor:not-allowed; }
    </style>
</head>
<body>
    <div id="brand">📺 ROUITA PLAYER</div>
    <div id="status">Initialisation…</div>
    <div id="error-message"><strong>Erreur</strong><span id="error-detail"></span><br><button id="retry">Réessayer</button></div>
    <video id="video" controls autoplay playsinline preload="auto"></video>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        "use strict";
        const params = new URLSearchParams(location.search);
        let originalUrl = (params.get("url") || "").trim();
        try { if (/^https?%3A/i.test(originalUrl)) originalUrl = decodeURIComponent(originalUrl); } catch(_){}
        
        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const errorBox = document.getElementById("error-message");
        const errorDetail = document.getElementById("error-detail");
        const retryBtn = document.getElementById("retry");
        
        let hlsPlayer = null, tsPlayer = null, attemptId = 0, recoveryAttempted = false;
        let loadTimeout = null, playing = false, retryLocked = false;
        
        function setStatus(m) { status.textContent = m; }
        function showError(m) { errorDetail.textContent = m; errorBox.style.display = "block"; setStatus("Échec"); clearLoadTimeout(); }
        function clearError() { errorBox.style.display = "none"; errorDetail.textContent = ""; }
        function clearLoadTimeout() { if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; } }
        function armLoadTimeout(id, ms) {
            clearLoadTimeout();
            loadTimeout = setTimeout(function() {
                if (id !== attemptId || playing) return;
                showError("Délai dépassé. Le flux ne répond pas (CORS bloqué ou serveur inaccessible).");
            }, ms || 25000);
        }
        
        function detectType(url) {
            const p = url.toLowerCase();
            if (/\.m3u8/.test(p)) return "hls";
            if (/\.(ts|m2ts)/.test(p)) return "mpegts";
            if (/\.flv/.test(p)) return "flv";
            if (/\.(mp4|m4v)/.test(p)) return "mp4";
            if (/\.webm/.test(p)) return "webm";
            return "unknown";
        }
        
        function destroyPlayers() {
            clearLoadTimeout();
            if (hlsPlayer) { try{hlsPlayer.destroy()}catch(_){} hlsPlayer = null; }
            if (tsPlayer) { try{tsPlayer.destroy()}catch(_){} tsPlayer = null; }
            try { video.pause(); video.removeAttribute("src"); video.load(); } catch(_){}
            playing = false;
        }
        
        function requestPlay(id) {
            if (id !== attemptId) return;
            video.play().catch(function(e) {
                if (id !== attemptId) return;
                if (e.name === "NotAllowedError") setStatus("Cliquez sur ▶");
            });
        }
        
        function startPlayback() {
            const id = ++attemptId;
            recoveryAttempted = false; playing = false;
            clearError(); destroyPlayers();
            
            if (!originalUrl) { showError("URL absente. Ajoutez ?url=..."); return; }
            try { new URL(originalUrl); } catch(_) { showError("URL invalide."); return; }
            
            armLoadTimeout(id, 25000);
            const type = detectType(originalUrl);
            
            if (type === "hls") playHls(originalUrl, id);
            else if (type === "mpegts" || type === "flv") playMpegTs(originalUrl, type, id);
            else playNative(originalUrl, id);
        }
        
        function playHls(url, id) {
            setStatus("Chargement HLS…");
            if (!window.Hls) { showError("HLS.js non chargé. Vérifiez votre connexion."); return; }
            if (!Hls.isSupported()) {
                if (video.canPlayType("application/vnd.apple.mpegurl")) playNative(url, id);
                else showError("HLS non supporté par ce navigateur.");
                return;
            }
            
            hlsPlayer = new Hls({
                enableWorker: true, lowLatencyMode: true,
                maxBufferLength: 10, maxMaxBufferLength: 30,
                manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 2,
                fragLoadingTimeOut: 25000, fragLoadingMaxRetry: 3
            });
            
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                if (id !== attemptId) return;
                setStatus("HLS prêt"); requestPlay(id);
            });
            
            hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
                if (id !== attemptId || !data.fatal) return;
                console.error("HLS error:", data);
                if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recoveryAttempted) {
                    recoveryAttempted = true; setStatus("Récupération…");
                    try { hlsPlayer.recoverMediaError(); } catch(_){}
                    return;
                }
                if (data.details === "manifestLoadError") {
                    showError("Impossible de charger le manifeste. Le serveur refuse les requêtes cross-origin (CORS). Un proxy est nécessaire pour ce flux.");
                } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    showError("Erreur réseau: " + data.details);
                } else {
                    showError("Erreur HLS: " + data.details);
                }
            });
            
            hlsPlayer.loadSource(url);
            hlsPlayer.attachMedia(video);
        }
        
        function playMpegTs(url, type, id) {
            setStatus("Chargement " + type + "…");
            if (!window.mpegts || !mpegts.isSupported()) { showError("MSE non supporté."); return; }
            tsPlayer = mpegts.createPlayer({ type: type === "flv" ? "flv" : "mpegts", isLive: true, url: url }, { enableWorker: true, enableStashBuffer: false });
            tsPlayer.on(mpegts.Events.ERROR, function(et, ed) {
                if (id !== attemptId) return;
                showError("Erreur " + type + ": " + et + " / " + ed);
            });
            tsPlayer.on(mpegts.Events.MEDIA_INFO, function() {
                if (id !== attemptId) return;
                setStatus(type + " prêt"); requestPlay(id);
            });
            tsPlayer.attachMediaElement(video);
            tsPlayer.load();
            requestPlay(id);
        }
        
        function playNative(url, id) {
            setStatus("Ouverture…");
            video.src = url; video.load(); requestPlay(id);
        }
        
        video.addEventListener("playing", function() { playing = true; clearLoadTimeout(); clearError(); setStatus("Lecture en cours"); });
        video.addEventListener("waiting", function() { setStatus("Chargement…"); });
        video.addEventListener("error", function() {
            if (hlsPlayer || tsPlayer) return;
            const err = video.error;
            if (err) showError("Erreur native code " + err.code);
        });
        
        retryBtn.addEventListener("click", function() {
            if (retryLocked) return;
            retryLocked = true; retryBtn.disabled = true;
            startPlayback();
            setTimeout(function() { retryLocked = false; retryBtn.disabled = false; }, 2000);
        });
        
        window.addEventListener("pagehide", destroyPlayers);
        startPlayback();
    });
    </script>
</body>
</html>
